spring.application.name=config-service
server.port=9999

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/Souhaib0101/ecom-ms-app.git}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.search-paths=${CONFIG_SEARCH_PATHS:config-repo}
spring.cloud.config.server.git.clone-on-start=true

spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health
