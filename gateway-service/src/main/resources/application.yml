spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health
