spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers
              uri: ${customer-service.url:http://localhost:8081}
              predicates:
                - Path=/customers,/customers/**
            - id: products
              uri: ${inventory-service.url:http://localhost:8082}
              predicates:
                - Path=/products,/products/**
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health
